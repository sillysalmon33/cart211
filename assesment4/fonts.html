<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia&effect=neon|outline|shadow-multiple">



    <style>
        body {
            font-family: "Sofia", sans-serif;
            font-size: 30px;
        }
    </style>



</head>

<body>
    <h1 class="font-effect-neon">Sofia is neon</h1>
    <p class="font-effect-shadow-multiple">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Ratione incidunt,
        vitae minima
        ut consequuntur nesciunt
        delectus eum nihil dignissimos excepturi, possimus neque non maiores reprehenderit totam natus veritatis porro!
        Tenetur.</p>
    <p class="font-effect-emboss">123456789</p>
</body>


</html>
